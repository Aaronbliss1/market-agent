name: Market Agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: market-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts for matplotlib
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run agent (track / scan / pulse / digest / commands)
        env:
          AGENT_DB: state/agent.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ secrets.DUNE_QUERY_ID }}
        run: python run.py headless dispatch

      - name: Persist state (agent.db)
        run: |
          git config user.email "market-agent@users.noreply.github.com"
          git config user.name "market-agent"
          git add state/agent.db || true
          if ! git diff --cached --quiet; then
            git commit -m "state update $(date -u +%FT%HZ)"
            git push
          fi
